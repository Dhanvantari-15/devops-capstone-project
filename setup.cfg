
[metadata]
name = customer-accounts
version = 1.0.0
description = Customer Accounts Microservice

[ nosetests ]
verbosity = 2
with-coverage = 1
cover-package = service
cover-erase = 1

[coverage:run]
source = service
omit =
    tests/*

[coverage:report]
show_missing = True
skip_covered = False

[flake8]
max-line-length = 127
exclude = .git,.venv,__pycache__

[pylint]
max-line-length = 127
